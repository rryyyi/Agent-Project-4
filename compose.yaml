services:
  personalab:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      PERSONALAB_DB: /data/personalab.db
    volumes:
      - personalab-data:/data
    restart: unless-stopped
volumes:
  personalab-data:
