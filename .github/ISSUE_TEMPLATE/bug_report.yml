name: Bug report
description: Report a reproducible failure in PersonaLab
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove API keys, private documents and personal data before submitting.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, package version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include a minimal sanitized experiment config and exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized diagnostics
      description: Include run status, error category and relevant trace fields. Never include credentials.
    validations:
      required: true
